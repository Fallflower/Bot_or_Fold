plugins {
    id "com.android.application"
}

def sdl2Version = "2.32.10"
def sdl2Urls = [
        "https://github.com/libsdl-org/SDL/releases/download/release-${sdl2Version}/SDL2-${sdl2Version}.tar.gz",
        "https://www.libsdl.org/release/SDL2-${sdl2Version}.tar.gz"
]
def sdl2DirValue = providers.gradleProperty("sdl2Dir")
        .orElse(providers.environmentVariable("SDL2_DIR"))
        .getOrElse("")
def usesManagedSdl2 = sdl2DirValue.isEmpty()
def sdl2Archive = file("${rootDir}/.deps/SDL2-${sdl2Version}.tar.gz")
def managedSdl2Dir = file("${rootDir}/.deps/SDL2-${sdl2Version}")
def sdl2Dir = usesManagedSdl2 ? managedSdl2Dir : file(sdl2DirValue)
def holdemRoot = file("../..")
def euiRoot = file("../../external/EUI-NEO")
def generatedEuiSourceDir = file("$buildDir/generated/euiNeoSource")
def generatedFrameworkAssetsDir = file("$buildDir/generated/euiFrameworkAssets")
def generatedGameAssetsDir = file("$buildDir/generated/holdemGameAssets")
def generatedResourceAssetsDir = file("$buildDir/generated/holdemResourceAssets")
def generatedIconResDir = file("$buildDir/generated/holdemLauncherIcon")

tasks.register("downloadSdl2") {
    outputs.file(sdl2Archive)
    onlyIf {
        usesManagedSdl2 && (!sdl2Archive.exists() || sdl2Archive.length() < 1024 * 1024)
    }
    doLast {
        sdl2Archive.parentFile.mkdirs()
        File tempArchive = file("${sdl2Archive}.download")
        Exception lastFailure = null
        for (String sdl2Url : sdl2Urls) {
            try {
                println "Downloading SDL2 ${sdl2Version} from ${sdl2Url}..."
                tempArchive.delete()
                new URL(sdl2Url).withInputStream { input ->
                    tempArchive.withOutputStream { output -> output << input }
                }
                if (tempArchive.length() < 1024 * 1024) {
                    throw new GradleException("Downloaded SDL2 archive is unexpectedly small: ${tempArchive.length()} bytes")
                }
                sdl2Archive.delete()
                if (!tempArchive.renameTo(sdl2Archive)) {
                    throw new GradleException("Could not move SDL2 archive into ${sdl2Archive}")
                }
                return
            } catch (Exception ex) {
                lastFailure = ex
            }
        }
        throw new GradleException("Could not download SDL2 ${sdl2Version}", lastFailure)
    }
}

tasks.register("prepareSdl2") {
    dependsOn("downloadSdl2")
    outputs.dir(sdl2Dir)
    doLast {
        if (usesManagedSdl2 && !file("${sdl2Dir}/CMakeLists.txt").exists()) {
            delete(sdl2Dir)
            copy {
                from tarTree(resources.gzip(sdl2Archive))
                into sdl2Archive.parentFile
            }
        }
        if (!file("${sdl2Dir}/CMakeLists.txt").exists()) {
            throw new GradleException("SDL2 was not found at ${sdl2Dir}. Set -Psdl2Dir=<SDL2 source dir> to use a custom checkout.")
        }
    }
}

tasks.register("prepareEuiNeoSource") {
    inputs.files(fileTree(euiRoot) {
        exclude ".git", ".git/**", "build/**", "Android/.gradle/**", "Android/app/build/**"
    })
    outputs.dir(generatedEuiSourceDir)
    doLast {
        delete(generatedEuiSourceDir)
        copy {
            from euiRoot
            into generatedEuiSourceDir
            exclude ".git", ".git/**", "build/**", "Android/.gradle/**", "Android/app/build/**"
        }

        // EUI currently sets currentTransform without rotating its projection,
        // viewport or scissor. Use Android's compositor until EUI implements the
        // complete Vulkan pre-rotation contract.
        File backend = file("${generatedEuiSourceDir}/core/render/vulkan/vulkan_backend.cpp")
        String original = "    swapchainInfo.preTransform = capabilities.currentTransform;"
        String replacement = """#if defined(__ANDROID__)
    swapchainInfo.preTransform =
        (capabilities.supportedTransforms & VK_SURFACE_TRANSFORM_IDENTITY_BIT_KHR) != 0
        ? VK_SURFACE_TRANSFORM_IDENTITY_BIT_KHR
        : capabilities.currentTransform;
#else
    swapchainInfo.preTransform = capabilities.currentTransform;
#endif"""
        String source = backend.getText("UTF-8")
        if (source.count(original) != 1) {
            throw new GradleException("The EUI Vulkan orientation patch no longer matches ${backend}")
        }
        backend.setText(source.replace(original, replacement), "UTF-8")

        // Android may report the new drawable size before its Vulkan surface and
        // swapchain have settled on that size. Keep rendering a few full frames
        // after every viewport change so the first visible frame cannot retain
        // the transition geometry until the next touch event.
        File sdlApp = file("${generatedEuiSourceDir}/core/app/sdl2_app_main.cpp")
        String stateOriginal = "#ifdef __ANDROID__\n    bool surfaceResetPending = false;\n#endif"
        String stateReplacement = "#ifdef __ANDROID__\n    bool surfaceResetPending = false;\n    int orientationSettleFrames = 0;\n    int lastDrawableWidth = 0;\n    int lastDrawableHeight = 0;\n#endif"
        String appSource = sdlApp.getText("UTF-8").replace("\r\n", "\n")
        if (appSource.count(stateOriginal) != 1) {
            throw new GradleException("The EUI Android viewport state patch no longer matches ${sdlApp}")
        }
        appSource = appSource.replace(stateOriginal, stateReplacement)

        String eventOriginal = "        case SDL_WINDOWEVENT_RESIZED:\n        case SDL_WINDOWEVENT_SIZE_CHANGED:\n        case SDL_WINDOWEVENT_SHOWN:"
        String eventReplacement = "        case SDL_WINDOWEVENT_RESIZED:\n        case SDL_WINDOWEVENT_SIZE_CHANGED:\n#ifdef __ANDROID__\n            state.orientationSettleFrames = 6;\n#endif\n        case SDL_WINDOWEVENT_SHOWN:"
        if (appSource.count(eventOriginal) != 1) {
            throw new GradleException("The EUI Android resize event patch no longer matches ${sdlApp}")
        }
        appSource = appSource.replace(eventOriginal, eventReplacement)

        String waitOriginal = "        const bool animating = state.anyAnimating(childWindows.anyAnimating());\n        if (!animating) {"
        String waitReplacement = "        const bool animating = state.anyAnimating(childWindows.anyAnimating());\n#ifdef __ANDROID__\n        const bool orientationSettling = state.orientationSettleFrames > 0;\n#else\n        const bool orientationSettling = false;\n#endif\n        if (!animating && !orientationSettling) {"
        if (appSource.count(waitOriginal) != 1) {
            throw new GradleException("The EUI Android frame wait patch no longer matches ${sdlApp}")
        }
        appSource = appSource.replace(waitOriginal, waitReplacement)

        String drawableOriginal = "        const float dpi = dpiScale(window);\n        const float pointer = pointerScale(window);"
        String drawableReplacement = "#ifdef __ANDROID__\n        const bool drawableSizeChanged =\n            state.lastDrawableWidth != drawableWidth ||\n            state.lastDrawableHeight != drawableHeight;\n        state.lastDrawableWidth = drawableWidth;\n        state.lastDrawableHeight = drawableHeight;\n        if (drawableSizeChanged) {\n            state.orientationSettleFrames = 6;\n        }\n        if (state.orientationSettleFrames > 0) {\n            --state.orientationSettleFrames;\n            state.paintRequested = true;\n            app::detail::requestFullPaint();\n        }\n#endif\n        const float dpi = dpiScale(window);\n        const float pointer = pointerScale(window);"
        if (appSource.count(drawableOriginal) != 1) {
            throw new GradleException("The EUI Android drawable size patch no longer matches ${sdlApp}")
        }
        appSource = appSource.replace(drawableOriginal, drawableReplacement)

        // Android 双指上下滑动调整 Raise。双指事件使用独立的输入标记，
        // 由游戏页的全屏 onScroll 接收，因此手势不要求落在滑动条上。
        String gestureMarker = "void queueFingerInput(SDL_Window* window, const SDL_TouchFingerEvent& finger) {"
        String gestureHelpers = '''#ifdef __ANDROID__
struct AndroidTwoFingerPoint {
    double x = 0.0;
    double y = 0.0;
};

struct AndroidTwoFingerGesture {
    std::unordered_map<SDL_FingerID, AndroidTwoFingerPoint> points;
    bool active = false;
};

std::unordered_map<SDL_Window*, AndroidTwoFingerGesture>& androidTwoFingerGestures() {
    static std::unordered_map<SDL_Window*, AndroidTwoFingerGesture> gestures;
    return gestures;
}

bool handleAndroidTwoFingerInput(SDL_Window* window,
                                 const SDL_TouchFingerEvent& finger,
                                 double x, double y) {
    auto& gesture = androidTwoFingerGestures()[window];
    if (finger.type == SDL_FINGERDOWN) {
        if (gesture.active || gesture.points.size() >= 1) {
            if (gesture.points.size() == 1) {
                auto first = gesture.points.begin();
                core::queuePointerInput(window, first->second.x, first->second.y, false);
                core::queuePointerInput(window, x, y, false);
                touchScrollStates().erase(window);
                gesture.active = true;
            }
            if (gesture.points.size() < 2) {
                gesture.points[finger.fingerId] = {x, y};
            }
            return true;
        }
        gesture.points[finger.fingerId] = {x, y};
        return false;
    }

    if (gesture.active) {
        auto it = gesture.points.find(finger.fingerId);
        if (it != gesture.points.end()) {
            const double dy = y - it->second.y;
            it->second = {x, y};
            if (finger.type == SDL_FINGERMOTION && dy != 0.0) {
                constexpr double kAndroidTwoFingerMarker = 7777.0;
                core::queueScrollInput(window, kAndroidTwoFingerMarker, -dy / 48.0);
            }
        }
        if (finger.type == SDL_FINGERUP) {
            gesture.points.erase(finger.fingerId);
            if (gesture.points.empty()) {
                androidTwoFingerGestures().erase(window);
            }
        }
        return true;
    }

    if (finger.type == SDL_FINGERUP) {
        gesture.points.erase(finger.fingerId);
        if (gesture.points.empty()) {
            androidTwoFingerGestures().erase(window);
        }
    }
    return false;
}
#endif

'''
        if (appSource.count(gestureMarker) != 1) {
            throw new GradleException("The Android two-finger gesture patch anchor no longer matches ${sdlApp}")
        }
        appSource = appSource.replace(gestureMarker, gestureHelpers + gestureMarker)

        String positionAnchor = "    TouchScrollState& state = touchScrollStates()[window];"
        String positionReplacement = "#ifdef __ANDROID__\n    if (handleAndroidTwoFingerInput(window, finger, x, y)) {\n        return;\n    }\n#endif\n\n" + positionAnchor
        if (appSource.count(positionAnchor) != 1) {
            throw new GradleException("The Android two-finger gesture insertion point no longer matches ${sdlApp}")
        }
        appSource = appSource.replace(positionAnchor, positionReplacement)
        String cleanupAnchor = "    touchScrollStates().erase(window);\n    core::platform::shutdownTray();"
        String cleanupReplacement = "    touchScrollStates().erase(window);\n#ifdef __ANDROID__\n    androidTwoFingerGestures().erase(window);\n#endif\n    core::platform::shutdownTray();"
        if (appSource.count(cleanupAnchor) != 1) {
            throw new GradleException("The Android two-finger gesture cleanup anchor no longer matches ${sdlApp}")
        }
        appSource = appSource.replace(cleanupAnchor, cleanupReplacement)
        sdlApp.setText(appSource, "UTF-8")
    }
}

tasks.register("syncFrameworkAssets", Copy) {
    dependsOn("prepareSdl2")
    from file("${euiRoot}/assets")
    exclude "icon.png"
    into file("$generatedFrameworkAssetsDir/assets")
}

tasks.register("syncGameAssets", Copy) {
    from file("${holdemRoot}/assets")
    into file("$generatedGameAssetsDir/assets")
}

tasks.register("syncGameResources", Copy) {
    from file("${holdemRoot}/resources")
    into file("$generatedResourceAssetsDir/resources")
}

tasks.register("syncLauncherIcon", Copy) {
    from file("${holdemRoot}/assets/icon.png")
    into file("$generatedIconResDir/drawable")
    rename { "app_icon.png" }
}

android {
    namespace "io.github.fallflower.botorfold"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "io.github.fallflower.botorfold"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0-android-stage-b"

        externalNativeBuild {
            cmake {
                arguments(
                        "-DEUI_ANDROID_SDL2_DIR=${sdl2Dir.absolutePath.replace("\\", "/")}",
                        "-DEUI_NEO_ROOT=${generatedEuiSourceDir.absolutePath.replace("\\", "/")}",
                        "-DHOLDEM_ROOT=${holdemRoot.absolutePath.replace("\\", "/")}")
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }

    sourceSets {
        main {
            java.srcDirs += [
                    "src/main/java",
                    "${euiRoot.absolutePath}/Android/app/src/main/java",
                    "${sdl2Dir.absolutePath}/android-project/app/src/main/java"
            ]
            assets.srcDirs += [
                    "src/main/assets",
                    generatedFrameworkAssetsDir,
                    generatedGameAssetsDir,
                    generatedResourceAssetsDir
            ]
            res.srcDirs += [generatedIconResDir]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        noCompress += ["bin", "gif", "ico", "otf", "png", "svg", "ttf"]
    }

    externalNativeBuild {
        cmake {
            path file("../cmake/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

preBuild.dependsOn(
        "prepareEuiNeoSource",
        "syncFrameworkAssets",
        "syncGameAssets",
        "syncGameResources",
        "syncLauncherIcon",
        "prepareSdl2"
)
tasks.matching {
    it.name.startsWith("configureCMake") ||
            it.name.startsWith("buildCMake") ||
            it.name.startsWith("externalNativeBuild")
}.configureEach {
    dependsOn("prepareSdl2", "prepareEuiNeoSource")
}
