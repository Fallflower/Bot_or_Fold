plugins {
    id "com.android.application"
}

def sdl2Version = "2.32.10"
def sdl2Urls = [
        "https://github.com/libsdl-org/SDL/releases/download/release-${sdl2Version}/SDL2-${sdl2Version}.tar.gz",
        "https://www.libsdl.org/release/SDL2-${sdl2Version}.tar.gz"
]
def sdl2DirValue = providers.gradleProperty("sdl2Dir")
        .orElse(providers.environmentVariable("SDL2_DIR"))
        .getOrElse("")
def usesManagedSdl2 = sdl2DirValue.isEmpty()
def sdl2Archive = file("${rootDir}/.deps/SDL2-${sdl2Version}.tar.gz")
def managedSdl2Dir = file("${rootDir}/.deps/SDL2-${sdl2Version}")
def sdl2Dir = usesManagedSdl2 ? managedSdl2Dir : file(sdl2DirValue)
def holdemRoot = file("../..")
def euiRoot = file("../../external/EUI-NEO")
def generatedEuiSourceDir = file("$buildDir/generated/euiNeoSource")
def generatedFrameworkAssetsDir = file("$buildDir/generated/euiFrameworkAssets")
def generatedGameAssetsDir = file("$buildDir/generated/holdemGameAssets")
def generatedResourceAssetsDir = file("$buildDir/generated/holdemResourceAssets")
def generatedIconResDir = file("$buildDir/generated/holdemLauncherIcon")

tasks.register("downloadSdl2") {
    outputs.file(sdl2Archive)
    onlyIf {
        usesManagedSdl2 && (!sdl2Archive.exists() || sdl2Archive.length() < 1024 * 1024)
    }
    doLast {
        sdl2Archive.parentFile.mkdirs()
        File tempArchive = file("${sdl2Archive}.download")
        Exception lastFailure = null
        for (String sdl2Url : sdl2Urls) {
            try {
                println "Downloading SDL2 ${sdl2Version} from ${sdl2Url}..."
                tempArchive.delete()
                new URL(sdl2Url).withInputStream { input ->
                    tempArchive.withOutputStream { output -> output << input }
                }
                if (tempArchive.length() < 1024 * 1024) {
                    throw new GradleException("Downloaded SDL2 archive is unexpectedly small: ${tempArchive.length()} bytes")
                }
                sdl2Archive.delete()
                if (!tempArchive.renameTo(sdl2Archive)) {
                    throw new GradleException("Could not move SDL2 archive into ${sdl2Archive}")
                }
                return
            } catch (Exception ex) {
                lastFailure = ex
            }
        }
        throw new GradleException("Could not download SDL2 ${sdl2Version}", lastFailure)
    }
}

tasks.register("prepareSdl2") {
    dependsOn("downloadSdl2")
    outputs.dir(sdl2Dir)
    doLast {
        if (usesManagedSdl2 && !file("${sdl2Dir}/CMakeLists.txt").exists()) {
            delete(sdl2Dir)
            copy {
                from tarTree(resources.gzip(sdl2Archive))
                into sdl2Archive.parentFile
            }
        }
        if (!file("${sdl2Dir}/CMakeLists.txt").exists()) {
            throw new GradleException("SDL2 was not found at ${sdl2Dir}. Set -Psdl2Dir=<SDL2 source dir> to use a custom checkout.")
        }
    }
}

tasks.register("prepareEuiNeoSource") {
    inputs.files(fileTree(euiRoot) {
        exclude ".git", ".git/**", "build/**", "Android/.gradle/**", "Android/app/build/**"
    })
    outputs.dir(generatedEuiSourceDir)
    doLast {
        delete(generatedEuiSourceDir)
        copy {
            from euiRoot
            into generatedEuiSourceDir
            exclude ".git", ".git/**", "build/**", "Android/.gradle/**", "Android/app/build/**"
        }

        // EUI currently sets currentTransform without rotating its projection,
        // viewport or scissor. Use Android's compositor until EUI implements the
        // complete Vulkan pre-rotation contract.
        File backend = file("${generatedEuiSourceDir}/core/render/vulkan/vulkan_backend.cpp")
        String original = "    swapchainInfo.preTransform = capabilities.currentTransform;"
        String replacement = """#if defined(__ANDROID__)
    swapchainInfo.preTransform =
        (capabilities.supportedTransforms & VK_SURFACE_TRANSFORM_IDENTITY_BIT_KHR) != 0
        ? VK_SURFACE_TRANSFORM_IDENTITY_BIT_KHR
        : capabilities.currentTransform;
#else
    swapchainInfo.preTransform = capabilities.currentTransform;
#endif"""
        String source = backend.getText("UTF-8")
        if (source.count(original) != 1) {
            throw new GradleException("The EUI Vulkan orientation patch no longer matches ${backend}")
        }
        backend.setText(source.replace(original, replacement), "UTF-8")
    }
}

tasks.register("syncFrameworkAssets", Copy) {
    dependsOn("prepareSdl2")
    from file("${euiRoot}/assets")
    exclude "icon.png"
    into file("$generatedFrameworkAssetsDir/assets")
}

tasks.register("syncGameAssets", Copy) {
    from file("${holdemRoot}/assets")
    into file("$generatedGameAssetsDir/assets")
}

tasks.register("syncGameResources", Copy) {
    from file("${holdemRoot}/resources")
    into file("$generatedResourceAssetsDir/resources")
}

tasks.register("syncLauncherIcon", Copy) {
    from file("${holdemRoot}/assets/icon.png")
    into file("$generatedIconResDir/drawable")
    rename { "app_icon.png" }
}

android {
    namespace "io.github.fallflower.botorfold"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "io.github.fallflower.botorfold"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0-android-stage-b"

        externalNativeBuild {
            cmake {
                arguments(
                        "-DEUI_ANDROID_SDL2_DIR=${sdl2Dir.absolutePath.replace("\\", "/")}",
                        "-DEUI_NEO_ROOT=${generatedEuiSourceDir.absolutePath.replace("\\", "/")}",
                        "-DHOLDEM_ROOT=${holdemRoot.absolutePath.replace("\\", "/")}")
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }

    sourceSets {
        main {
            java.srcDirs += [
                    "src/main/java",
                    "${euiRoot.absolutePath}/Android/app/src/main/java",
                    "${sdl2Dir.absolutePath}/android-project/app/src/main/java"
            ]
            assets.srcDirs += [
                    "src/main/assets",
                    generatedFrameworkAssetsDir,
                    generatedGameAssetsDir,
                    generatedResourceAssetsDir
            ]
            res.srcDirs += [generatedIconResDir]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        noCompress += ["bin", "gif", "ico", "otf", "png", "svg", "ttf"]
    }

    externalNativeBuild {
        cmake {
            path file("../cmake/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

preBuild.dependsOn(
        "prepareEuiNeoSource",
        "syncFrameworkAssets",
        "syncGameAssets",
        "syncGameResources",
        "syncLauncherIcon",
        "prepareSdl2"
)
tasks.matching {
    it.name.startsWith("configureCMake") ||
            it.name.startsWith("buildCMake") ||
            it.name.startsWith("externalNativeBuild")
}.configureEach {
    dependsOn("prepareSdl2", "prepareEuiNeoSource")
}
